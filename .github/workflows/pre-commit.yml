name: Style Enforcement

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main

jobs:
  enforce-style:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Clang-Format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Check Formatting
        run: |
          set -euo pipefail

          git ls-files -z | grep -zE '\.(cpp|hpp|h)$' | grep -zvE 'include/utils/json.hpp|tests/catch.hpp|tests/' | \
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            if ! timeout 10s clang-format --dry-run --Werror -style=file "$file"; then
              echo "ERROR: clang-format failed or timed out on $file"
              exit 1
            fi
          done

      - name: Install Cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck

      - name: Static Analysis (Safety Check)
        run: |
          cppcheck \
            --enable=warning,style,performance \
            --error-exitcode=1 \
            --force \
            --inline-suppr \
            --suppress=syntaxError:include/utils/json.hpp \
            --suppress=*:include/utils/json.hpp \
            --suppress=missingIncludeSystem \
            --suppress=useStlAlgorithm \
            src/

  python-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python test tooling
        run: pip install -r tests/requirements.txt

      - name: Ruff lint
        run: ruff check tests/selenium tests/integration

      - name: Ruff format
        run: ruff format --check tests/selenium tests/integration

      - name: Install build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y make g++

      - name: Build C++ binary
        run: make

      - name: Integration tests (unittest via pytest)
        run: pytest tests/integration -v --tb=short

      - name: Set up Chrome for Selenium
        uses: browser-actions/setup-chrome@v1

      - name: Selenium BDD tests
        run: pytest tests/selenium -v --tb=short
