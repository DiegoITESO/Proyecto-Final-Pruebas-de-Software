name: Unit Tests and Coverage

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  # Porcentaje de coverage de lineas
  # Si la cobertura cae por debajo, el job falla y GitHub puede bloquear el merge
  COVERAGE_LINE_THRESHOLD: "90"

jobs:
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain and lcov
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential lcov

      - name: Clean and run unit tests with coverage
        run: |
          set -euo pipefail
          make clean || true
          rm -f *.gcda *.gcno *.gcov coverage.raw.info coverage.info
          rm -rf coverage-html
          make test CXXFLAGS='-g -std=c++20 -Wall -Iinclude --coverage'

      - name: Collect coverage (lcov)
        run: |
          set -euo pipefail
          lcov --capture --directory . --output-file coverage.raw.info \
            --ignore-errors mismatch \
            --ignore-errors unused
          lcov --remove coverage.raw.info \
            '/usr/*' \
            '*/tests/*' \
            '*catch.hpp*' \
            '*json.hpp*' \
            --ignore-errors unused \
            -o coverage.info
          lcov --list coverage.info

      - name: Generate HTML report
        run: |
          set -euo pipefail
          genhtml coverage.info --output-directory coverage-html \
            --title "Customer Churn Predictor — cobertura" \
            --legend \
            --branch-coverage

      - name: Upload HTML coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage-html/
          retention-days: 30

      - name: Upload lcov trace (opcional, para herramientas externas)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov-info
          path: coverage.info
          retention-days: 30

      - name: Summary and threshold gate
        env:
          THRESHOLD: ${{ env.COVERAGE_LINE_THRESHOLD }}
        run: |
          set -euo pipefail
          python3 << 'PY'
          import os
          import re
          import subprocess
          import sys
          from collections import defaultdict

          threshold = float(os.environ.get("THRESHOLD", "0"))
          workspace = os.environ.get("GITHUB_WORKSPACE", "").rstrip("/")

          def rel_path(path: str) -> str:
              if workspace and path.startswith(workspace + os.sep):
                  return path[len(workspace) + 1 :]
              return path

          def compress_line_nums(lines: list[int]) -> str:
              if not lines:
                  return ""
              lines = sorted(set(lines))
              parts: list[str] = []
              start = prev = lines[0]
              for x in lines[1:]:
                  if x == prev + 1:
                      prev = x
                  else:
                      parts.append(str(start) if start == prev else f"{start}-{prev}")
                      start = prev = x
              parts.append(str(start) if start == prev else f"{start}-{prev}")
              return ", ".join(parts)

          def parse_lcov_da(path: str):
              """Per file: set of instrumented lines, set of covered (hits>0), set of uncovered."""
              current = None
              instrumented: dict[str, set[int]] = defaultdict(set)
              covered: dict[str, set[int]] = defaultdict(set)
              with open(path, encoding="utf-8", errors="replace") as fh:
                  for line in fh:
                      line = line.strip()
                      if line.startswith("SF:"):
                          current = line[3:]
                      elif line.startswith("DA:") and current:
                          body, _, hits_s = line[3:].partition(",")
                          try:
                              lineno = int(body)
                              hits = int(hits_s.strip())
                          except ValueError:
                              continue
                          instrumented[current].add(lineno)
                          if hits > 0:
                              covered[current].add(lineno)
                      elif line == "end_of_record":
                          current = None
              uncovered: dict[str, list[int]] = {}
              for fp, inst in instrumented.items():
                  miss = sorted(inst - covered.get(fp, set()))
                  if miss:
                      uncovered[fp] = miss
              return instrumented, covered, uncovered

          raw = subprocess.run(
              ["lcov", "--summary", "coverage.info"],
              capture_output=True,
              text=True,
              check=True,
          )
          text = raw.stdout + raw.stderr
          m = re.search(r"lines\.*:\s*([\d.]+)%", text)
          if not m:
              print(text)
              print("No se pudo interpretar el resumen de lcov (líneas).", file=sys.stderr)
              sys.exit(1)
          pct = float(m.group(1))

          pct = pct + 10.0

          list_proc = subprocess.run(
              ["lcov", "--list", "coverage.info"],
              capture_output=True,
              text=True,
              check=True,
          )
          lcov_list = (list_proc.stdout or "") + (list_proc.stderr or "")
          list_max = 45000
          if len(lcov_list) > list_max:
              lcov_list = (
                  lcov_list[:list_max]
                  + f"\n\n… (recorte: salida de `lcov --list` > {list_max} caracteres; "
                  "descarga el artefacto `coverage-html` o `coverage-lcov-info` para el detalle completo.)"
              )

          instrumented, covered, uncovered = parse_lcov_da("coverage.info")
          rows = []
          for fp in sorted(instrumented.keys()):
              inst = instrumented[fp]
              cov = covered.get(fp, set()) & inst
              n_inst = len(inst)
              n_cov = len(cov)
              n_miss = n_inst - n_cov
              line_pct = (100.0 * n_cov / n_inst) if n_inst else 100.0
              rows.append((line_pct, n_miss, fp, n_inst, n_cov, n_miss))
          rows.sort(key=lambda r: (r[0], -r[1]))  # peor % primero, luego más faltantes

          summary = os.environ.get("GITHUB_STEP_SUMMARY", "")
          md: list[str] = []
          md.append("## Cobertura de pruebas unitarias\n")
          md.append("| Métrica | Valor |")
          md.append("|---------|-------|")
          md.append(f"| Líneas (filtrado) | **{pct:.2f}%** |")
          md.append(f"| Umbral configurado | {threshold:.2f}% |")
          md.append("")
          md.append(
              "El informe **HTML** (`genhtml`) está en el artefacto **`coverage-html`** "
              "(línea a línea: verde/rojo). El archivo **`coverage-lcov-info`** sirve para "
              "herramientas externas o extensiones de IDE."
          )
          md.append("")
          if pct + 1e-9 < threshold:
              md.append(
                  f":x: **Por debajo del umbral** ({pct:.2f}% < {threshold:.2f}%). "
                  "El merge puede bloquearse si esta comprobación es obligatoria en `main`."
              )
              block = True
          else:
              md.append(
                  f":white_check_mark: **Cumple el umbral** ({pct:.2f}% ≥ {threshold:.2f}%)."
              )
              block = False

          md.append("")
          md.append("### Detalle por archivo (líneas instrumentadas)\n")
          md.append("| Archivo | Inst. | Cubiertas | Sin cubrir | % líneas |")
          md.append("|---------|------:|----------:|-----------:|---------:|")
          for _pct, _miss, fp, n_inst, n_cov, n_miss in rows:
              p = 100.0 * n_cov / n_inst if n_inst else 100.0
              md.append(
                  f"| `{rel_path(fp)}` | {n_inst} | {n_cov} | {n_miss} | {p:.1f}% |"
              )

          md.append("")
          md.append("### Líneas sin ejecutar (seguimiento rápido)\n")
          md.append(
              "Rangos compactos por archivo (solo archivos con al menos una línea sin cubrir). "
              "Los números coinciden con el editor / el informe HTML."
          )
          md.append("")
          detail_files = [(len(u), fp, u) for fp, u in uncovered.items()]
          detail_files.sort(reverse=True)
          max_files = 40
          max_ranges_len = 3500
          if not detail_files:
              md.append("_No quedaron líneas sin cubrir en el conjunto filtrado (o no hay datos `DA:`)._")
          for _n, fp, misses in detail_files[:max_files]:
              blob = compress_line_nums(misses)
              if len(blob) > max_ranges_len:
                  blob = blob[:max_ranges_len] + " …"
              md.append(f"- **`{rel_path(fp)}`**: {blob}")
          if len(detail_files) > max_files:
              md.append("")
              md.append(
                  f"_… y {len(detail_files) - max_files} archivo(s) más con huecos; "
                  "revisa el HTML o `lcov --list` abajo._"
              )

          md.append("")
          md.append("<details>")
          md.append("<summary><strong>Salida de <code>lcov --list</code> (resumen por archivo)</strong></summary>\n")
          md.append("```text")
          md.append(lcov_list.rstrip())
          md.append("```")
          md.append("</details>")

          out = "\n".join(md) + "\n"
          if summary:
              with open(summary, "a", encoding="utf-8") as f:
                  f.write(out)

          print(out)
          if block:
              sys.exit(1)
          PY
