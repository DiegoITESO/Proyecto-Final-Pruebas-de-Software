[tool.ruff]
line-length = 100
target-version = "py310"
src = ["tests/selenium", "tests/integration"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests/selenium", "tests/integration"]
pythonpath = ["."]
# Global installs of langsmith register pytest11 as "langsmith_plugin"; it can
# crash on import with some pydantic versions. Block it so project tests run.
addopts = ["-p", "no:langsmith_plugin"]
filterwarnings = ["ignore::DeprecationWarning:selenium.*"]
